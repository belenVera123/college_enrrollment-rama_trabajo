<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Evaluaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <nav class="mb-4">
        <a href="index.html" class="btn btn-outline-secondary">Volver al Inicio</a>
    </nav>

    <h2>Configuración de Evaluaciones (ASSESSMENT)</h2>

    <div class="card card-body mb-4 shadow-sm">
        <form id="assessmentForm">
            <input type="hidden" id="assessmentId">
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label">Curso (Obligatorio)</label>
                    <select id="courseId" class="form-select" required></select>
                </div>
                <div class="col-md-4 mb-3">
                    <label class="form-label">Nombre de Evaluación</label>
                    <input type="text" id="nombre" class="form-control" maxlength="100" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Puntaje Máx.</label>
                    <input type="number" id="puntaje" class="form-control" max="100" required>
                </div>
                <div class="col-md-2 mb-3">
                    <label class="form-label">Fecha</label>
                    <input type="date" id="fechaEvaluacion" class="form-control" required>
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">Descripción (Opcional)</label>
                    <textarea id="descripcion" class="form-control" rows="2" maxlength="500"></textarea>
                </div>
            </div>
            <button type="submit" class="btn btn-success">Guardar Evaluación</button>
            <button type="button" class="btn btn-warning" onclick="limpiarFormulario()">Cancelar</button>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-striped border">
            <thead class="table-dark">
                <tr>
                    <th>Curso</th>
                    <th>Nombre</th>
                    <th>Puntaje</th>
                    <th>Fecha</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                </tbody>
        </table>
    </div>

    <script src="./assets/js/Assessments.js"></script>
</body>
</html>
