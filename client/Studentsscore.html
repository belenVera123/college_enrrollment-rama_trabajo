<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD Student Scores - Gestión Académica</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestión de Puntajes de Estudiantes</h2>
        <span class="badge bg-success">Servidor Activo: http://localhost:5000</span>
    </div>

    <div class="card card-body shadow-sm mb-4">
        <form id="scoreForm">
            <input type="hidden" id="idScore">
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Evaluación</label>
                    <select id="assessmentId" class="form-select" required>
                        <option value="">Seleccione la evaluación...</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Inscripción (Alumno - Curso)</label>
                    <select id="enrollmentId" class="form-select" required>
                        <option value="">Seleccione al alumno...</option>
                    </select>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Puntaje Obtenido (0-100)</label>
                    <input type="number" id="puntaje" class="form-control" max="100" min="0" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-bold">Observaciones</label>
                    <input type="text" id="observaciones" class="form-control" placeholder="Ej: Excelente desempeño">
                </div>
            </div>
            <div class="mt-2">
                <button type="button" class="btn btn-primary px-4" onclick="guardar()">Guardar Registro</button>
                <button type="button" class="btn btn-outline-secondary" onclick="limpiar()">Limpiar</button>
            </div>
        </form>
    </div>

    <div class="table-responsive">
        <table class="table table-hover table-bordered shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>Evaluación</th>
                    <th>Curso</th>
                    <th>Alumno</th>
                    <th class="text-center">Puntaje</th>
                    <th>Observaciones</th>
                    <th class="text-center">Acciones</th>
                </tr>
            </thead>
            <tbody id="cuerpoTabla">
                </tbody>
        </table>
    </div>

    <script src="./assets/js/Studentscore.js"></script>
</body>
</html>
